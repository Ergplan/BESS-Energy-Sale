<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · JouleWise</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#F4F2EC;--card:#FFFFFF;--ink:#2B2410;--muted:#6E6550;--line:#E2DCCB;--gold:#C9A20E;--brown:#4A3A0A;--bad:#B42318;--bad-bg:#FDECEA}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px 26px;box-shadow:0 1px 2px rgba(43,36,16,.05),0 10px 30px rgba(43,36,16,.07)}
  .logo{display:block;width:210px;max-width:100%;height:auto;margin:0 auto 22px}
  h1{font-size:19px;font-weight:600;margin:0;text-align:center}
  .sub{margin:6px 0 0;text-align:center;color:var(--muted);font-size:13.5px}
  .badge{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 22px;padding:7px 12px;border-radius:999px;background:#FBF6E3;border:1px solid #EADFB4;color:var(--brown);font-size:12.5px;font-weight:600;width:fit-content}
  .badge svg{flex:none}
  form{display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  input{font:inherit;font-size:15px;color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#FFFEFB}
  input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
  button{font:inherit;font-size:15px;font-weight:600;padding:12px;border:0;border-radius:9px;background:var(--brown);color:#fff;cursor:pointer;margin-top:4px}
  button:hover{background:#3A2D06}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .err{background:var(--bad-bg);color:var(--bad);border:1px solid #F5C2BC;border-radius:9px;padding:10px 12px;font-size:13.5px}
  .foot{text-align:center;color:var(--muted);font-size:12px;line-height:1.5}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <img class="logo" src="/joulewise-logo.jpg" alt="JouleWise" width="981" height="230">
      <h1>IEX BESS Arbitrage Model</h1>
      <p class="sub">Solar + storage arbitrage on CTU night connectivity</p>
      <div class="badge"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L12 3 V7 C12 10 9.8 12.2 7 13 C4.2 12.2 2 10 2 7 V3 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.8 7 L6.4 8.6 L9.4 5.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Authorized for SAEL Group</div>
      <form method="post" action="/login" id="f">
        <div class="err" id="err" hidden>The email or password is incorrect. Check them and try again.</div>
        <label>Email<input type="email" name="email" id="email" autocomplete="username" required autofocus></label>
        <label>Password<input type="password" name="password" id="password" autocomplete="current-password" required></label>
        <input type="hidden" name="next" id="next" value="/">
        <button type="submit">Sign in</button>
      </form>
    </div>
    <p class="foot">Access is restricted to authorized SAEL Group users.<br>© JouleWise</p>
  </main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('e')) document.getElementById('err').hidden = false;
  const n = q.get('next'); if (n && n.startsWith('/') && !n.startsWith('//')) document.getElementById('next').value = n;
</script>
</body>
</html>
